<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 140" role="img" aria-label="codeindex">
  <title>codeindex</title>
  <defs>
    <linearGradient id="ci" x1="18" y1="122" x2="122" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f46e5"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect x="18" y="18" width="104" height="104" rx="28" fill="url(#ci)"/>
  <!-- The mark is icon.svg's paths verbatim, placed by a transform rather than
       re-drawn at this scale. Re-drawing is how a wordmark and a favicon slowly
       stop being the same logo. 104/512 = 0.203125, and the strokes scale with
       it. -->
  <g transform="translate(18 18) scale(0.203125)">
    <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
      <g stroke-width="34">
        <path d="M170 128c-34 0-46 18-46 44v38c0 22-14 34-34 34 20 0 34 12 34 34v38c0 26 12 44 46 44"/>
        <path d="M342 128c34 0 46 18 46 44v38c0 22 14 34 34 34-20 0-34 12-34 34v38c0 26-12 44-46 44"/>
      </g>
      <g stroke-width="30">
        <path d="M259 226a38 38 0 1 0 0 60"/>
        <path d="M300 232v56"/>
        <path d="M300 194v2"/>
      </g>
    </g>
  </g>
  <text x="150" y="88" font-family="'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"
        font-size="62" font-weight="700" letter-spacing="-2" fill="#12151C">codeindex</text>
</svg>
