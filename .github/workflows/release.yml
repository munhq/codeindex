name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            artifact: codeindex-x86_64-linux
          - os: ubuntu-latest
            target: aarch64-linux
            artifact: codeindex-aarch64-linux
          - os: macos-latest
            target: aarch64-macos
            artifact: codeindex-aarch64-macos
          - os: macos-latest
            target: x86_64-macos
            artifact: codeindex-x86_64-macos
          # Windows was absent entirely: no asset, and the source did not compile
          # for it. Both are fixed, so it ships like the others.
          - os: ubuntu-latest
            target: x86_64-windows
            artifact: codeindex-x86_64-windows.exe
          - os: ubuntu-latest
            target: aarch64-windows
            artifact: codeindex-aarch64-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Fetch vendor dependencies
        env:
          # Anonymous https clones get throttled on Actions runners and git
          # falls back to a credential prompt, which fails the job.
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          cd zig && ./fetch-vendor.sh

      # The tag is the single source of truth for the version. Release v0.2.0
      # shipped a binary answering `codeindex 0.1.0` because the version was a
      # literal in main.zig that nobody edited when the tag was cut.
      - name: Derive the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          cd zig
          zig build -Doptimize=ReleaseFast \
            -Dtarget=${{ matrix.target }} \
            -Dversion=${{ steps.version.outputs.value }}

      # Cross-built artifacts cannot run here, so only the native target is
      # checked — enough to catch a version that does not match its tag, which
      # is the drift that shipped once already.
      - name: The binary must name its own tag
        if: matrix.target == 'x86_64-linux'
        run: |
          got="$(zig/zig-out/bin/codeindex -v)"
          want="codeindex ${{ steps.version.outputs.value }}"
          echo "reported: $got"
          echo "expected: $want"
          test "$got" = "$want"

      # The binary is stripped at link time by build.zig, so there is no
      # post-processing step: a host `strip` cannot handle a cross-built target,
      # and `zig objcopy --strip-all` is unimplemented in 0.16.
      - name: Report the artifact size
        run: |
          cd zig
          src=zig-out/bin/codeindex
          [ -f "$src.exe" ] && src="$src.exe"
          echo "${{ matrix.target }}: $(wc -c < "$src") bytes"

      - name: Package
        run: |
          src=zig/zig-out/bin/codeindex
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Publish checksums computed by CI, over the exact bytes being uploaded.
      # Downstream installers that pin a hash need a canonical source for it;
      # without one they either skip verification or pin a hash somebody read off
      # a local build, which is how a pin ends up not matching the release. A
      # checksum served beside the binary is not by itself proof — whoever can
      # replace one can replace the other — so this is the input to a pin
      # recorded in the consumer's source, not a substitute for it.
      # The .mcpb bundle — what Smithery requires for a stdio release, and what
      # Claude Desktop installs with a double click. Built HERE, before the
      # checksums, so it is hashed alongside the binaries and cannot describe a
      # version this release does not contain.
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bundle (.mcpb)
        run: |
          BIN=artifacts/codeindex-x86_64-linux/codeindex-x86_64-linux
          chmod +x "$BIN"
          # Declare the tool list the server really advertises by asking the
          # binary being released, rather than a copy in a manifest that drifts.
          node npm/capture-card.mjs --out card.json -- ./artifacts/codeindex-x86_64-linux/codeindex-x86_64-linux --mcp --workspace src
          VERSION=$(node -p "require('./src/npm/package.json').version")
          node src/npm/build-mcpb.mjs --card card.json --out "artifacts/codeindex-$VERSION.mcpb"

      - name: Checksums
        run: |
          cd artifacts
          find . -type f ! -name SHA256SUMS -printf '%f %p\n' | sort |
            while read -r name path; do
              printf '%s  %s\n' "$(sha256sum "$path" | cut -d' ' -f1)" "$name"
            done | tee SHA256SUMS
          cd ..

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*/*
            artifacts/*.mcpb
            artifacts/SHA256SUMS
          generate_release_notes: true
