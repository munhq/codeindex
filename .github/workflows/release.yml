name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            artifact: codeindex-x86_64-linux
          - os: ubuntu-latest
            target: aarch64-linux
            artifact: codeindex-aarch64-linux
          - os: macos-latest
            target: aarch64-macos
            artifact: codeindex-aarch64-macos
          - os: macos-latest
            target: x86_64-macos
            artifact: codeindex-x86_64-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Fetch vendor dependencies
        env:
          # Anonymous https clones get throttled on Actions runners and git
          # falls back to a credential prompt, which fails the job.
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          cd zig && ./fetch-vendor.sh

      # The tag is the single source of truth for the version. Release v0.2.0
      # shipped a binary answering `codeindex 0.1.0` because the version was a
      # literal in main.zig that nobody edited when the tag was cut.
      - name: Derive the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          cd zig
          zig build -Doptimize=ReleaseFast \
            -Dtarget=${{ matrix.target }} \
            -Dversion=${{ steps.version.outputs.value }}

      # Cross-built artifacts cannot run here, so only the native target is
      # checked — enough to catch a version that does not match its tag, which
      # is the drift that shipped once already.
      - name: The binary must name its own tag
        if: matrix.target == 'x86_64-linux'
        run: |
          got="$(zig/zig-out/bin/codeindex -v)"
          want="codeindex ${{ steps.version.outputs.value }}"
          echo "reported: $got"
          echo "expected: $want"
          test "$got" = "$want"

      - name: Strip (Linux)
        if: contains(matrix.target, 'linux')
        run: strip zig/zig-out/bin/codeindex || true

      - name: Package
        run: cp zig/zig-out/bin/codeindex ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          generate_release_notes: true
