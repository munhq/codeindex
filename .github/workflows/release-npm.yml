# Publish the npm wrapper on a version tag.
#
# The package carries no binary — 4 KB of JavaScript that resolves the release
# asset for the platform, verifies it against the published SHA256SUMS and
# executes it. It exists because every MCP directory installs servers the way npm
# installs them: the official registry validates an npm version, Smithery runs
# `npx`, mcp.so lists the same command. A compiled server with no npm name is
# invisible to all three.
#
# ── Authentication, and why it is in two phases ───────────────────────────────
#
# The destination is Trusted Publishing (OIDC): npm accepts a publish proven by a
# short-lived token GitHub mints for THIS repo and THIS workflow file, so no npm
# token exists to leak or rotate. `id-token: write` below is what mints it.
#
# It cannot be phase one. A trusted publisher is configured on the package's
# settings page at npmjs.com, and a package that has never been published has no
# settings page. So:
#
#   Phase 1, once: an NPM_TOKEN secret in this repo publishes the first version.
#     npmjs.com -> Access Tokens -> Generate -> Granular, packages: codeindex-mcp,
#     permission: Read and write. Paste it at
#     github.com/munhq/codeindex/settings/secrets/actions as NPM_TOKEN.
#   Phase 2, once, then forever tokenless:
#     npmjs.com -> Packages -> codeindex-mcp -> Settings -> Trusted Publisher
#     Publisher: GitHub Actions | Owner: munhq | Repo: codeindex
#     Workflow: release-npm.yml | Allowed actions: npm publish
#     Then DELETE the NPM_TOKEN secret. This workflow switches by itself: the
#     publish step uses the token only while the secret exists.
#
# Node 22 and npm 11.5.1 are MINIMUMS for OIDC. The rest of CI runs on whatever
# the runner ships; pinning here means phase 2 fails with a version error rather
# than a confusing auth error.
#
# ── Why this waits ───────────────────────────────────────────────────────────
#
# The wrapper downloads from the tag it is versioned as, so publishing it before
# release.yml has uploaded the assets ships a package that 404s for everyone who
# installs in that window. This waits for the assets instead of racing them.
name: release-npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and validate, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # load-bearing in phase 2: this is the OIDC proof

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'   # required: it writes the
                                                       # .npmrc both auth paths
                                                       # read

      - name: npm must be new enough for OIDC
        run: |
          npm install -g npm@latest
          npm --version

      # The package version decides which release the wrapper downloads from, so
      # it is checked rather than trusted: three files carry the number and they
      # are edited by different hands.
      #
      # v0.3.2 was released before this workflow existed, so the first publish
      # is a dispatch rather than a tag push. Every check below therefore keys
      # off the package version, not GITHUB_REF_NAME, and a tag push additionally
      # has to agree with it. Nothing is skipped just because no tag triggered
      # the run — an unverified publish is the failure this file exists to stop.
      - name: Resolve the version, and make the manifests agree
        id: v
        run: |
          PKG=$(node -p "require('./npm/package.json').version")
          SRV=$(node -p "require('./server.json').version")
          SRVPKG=$(node -p "require('./server.json').packages[0].version")
          for pair in "server.json:$SRV" "server.json/packages:$SRVPKG"; do
            if [ "${pair#*:}" != "$PKG" ]; then
              echo "::error::${pair%%:*} says ${pair#*:}, npm/package.json says $PKG"
              exit 1
            fi
          done
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match npm/package.json $PKG"
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "publishing codeindex-mcp@$PKG against release v$PKG"

      - name: The resolver must still match the release matrix
        run: bash plugin/test_platform.sh

      # release.yml builds six targets and a SHA256SUMS on this same tag. Poll
      # for the checksum file: it is written last, after every asset is uploaded,
      # so its presence means the whole set is there.
      - name: Wait for the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.version }}
        run: |
          for i in $(seq 1 60); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --json assets --jq '.assets[].name' 2>/dev/null | grep -qx SHA256SUMS; then
              echo "assets are up"
              exit 0
            fi
            echo "waiting for $TAG assets ($i/60)"
            sleep 20
          done
          echo "::error::release assets never appeared after 20 minutes"
          exit 1

      # Prove the thing being published actually works: fetch the real asset for
      # this runner from the real release and complete a real handshake. A
      # wrapper that resolves the wrong asset name fails here rather than in a
      # stranger's editor, which is how the Mac 404 escaped once already.
      - name: The wrapper must fetch and start the server
        working-directory: npm
        run: |
          node bin/postinstall.js
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 120 node bin/codeindex-mcp.js > handshake.json
          node -e '
            const fs = require("fs");
            const line = fs.readFileSync("handshake.json", "utf8").split("\n").find(Boolean);
            const got = JSON.parse(line).result.serverInfo;
            const want = require("./package.json").version;
            if (got.name !== "codeindex" || got.version !== want) {
              console.error(`::error::handshake says ${got.name} ${got.version}, expected codeindex ${want}`);
              process.exit(1);
            }
            console.log(`handshake ok: ${got.name} ${got.version}`);
          '
          rm -f handshake.json

      - name: Pack (dry run)
        if: inputs.dry_run
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --dry-run --access public

      # --provenance attests that the tarball came from this commit and this
      # workflow, which is most of the reason to publish from CI at all. It needs
      # a PUBLIC repo: npm cannot verify an attestation whose source nobody can
      # read. Decided from the repository's own visibility rather than a
      # hand-maintained flag.
      #
      # The token path and the OIDC path differ by one thing: whether
      # NODE_AUTH_TOKEN is set. Phase 2 begins the moment the secret is deleted,
      # with no edit here.
      - name: Publish
        if: '!inputs.dry_run'
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "publishing with the NPM_TOKEN secret (phase 1)"
          else
            echo "no NPM_TOKEN secret — publishing with trusted publishing (OIDC)"
          fi
          if [ "${{ github.event.repository.private }}" = "false" ]; then
            npm publish --access public --provenance
          else
            echo "::warning::repo is private, publishing WITHOUT provenance"
            npm publish --access public
          fi
