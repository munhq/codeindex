# Publish the npm wrapper on a version tag.
#
# The package contains no binary — 4 KB of JavaScript that resolves the release
# asset for the platform, verifies its checksum and executes it. It exists
# because every MCP directory installs servers the way npm installs them: the
# official registry validates an npm version, Smithery runs `npx`, mcp.so lists
# the same command. A compiled server with no npm name is invisible to all three.
#
# Ordering matters and is enforced, not assumed. The wrapper downloads from the
# tag it is versioned as, so publishing it before release.yml has uploaded the
# assets ships a package that 404s for every user who installs in that window.
# This waits for the assets instead of racing them.
name: release-npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # The package version must equal the tag, or the wrapper downloads from a
      # tag that does not exist. Checked here rather than trusted, because the
      # two are edited in different files by different hands.
      - name: The package version must match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./npm/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match npm/package.json $PKG" >&2
            exit 1
          fi
          echo "publishing @munhq/codeindex@$PKG"

      - name: The resolver must still match the release matrix
        run: bash plugin/test_platform.sh

      # release.yml builds six targets and a SHA256SUMS on this same tag. Poll
      # for the checksum file: it is written last, after every asset is uploaded,
      # so its presence means the whole set is there.
      - name: Wait for the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --json assets --jq '.assets[].name' 2>/dev/null | grep -qx SHA256SUMS; then
              echo "assets are up"
              exit 0
            fi
            echo "waiting for $GITHUB_REF_NAME assets ($i/60)"
            sleep 20
          done
          echo "release assets never appeared after 20 minutes" >&2
          exit 1

      # Prove the published package actually works before publishing it: fetch
      # the real asset for this runner from the real release and run the real
      # handshake. A wrapper that resolves the wrong name fails here rather than
      # in a stranger's editor.
      - name: The wrapper must fetch and start the server
        run: |
          cd npm
          node bin/postinstall.js
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 60 node bin/codeindex-mcp.js > handshake.json
          node -e '
            const r = JSON.parse(require("fs").readFileSync("handshake.json","utf8").split("\n")[0]);
            const got = r.result.serverInfo;
            const want = require("./package.json").version;
            if (got.name !== "codeindex" || got.version !== want) {
              console.error("handshake says", got, "expected codeindex", want);
              process.exit(1);
            }
            console.log("handshake ok:", got.name, got.version);
          '

      - name: Publish
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
