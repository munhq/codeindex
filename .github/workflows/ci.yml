name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The engine is built and its tests run on every platform it ships for. This
  # was ubuntu only, so a watcher that could not work anywhere but Linux passed
  # CI for as long as it existed, and macOS binaries were published having never
  # executed a single test.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows runners default to PowerShell; every step here is shell, and bash
    # ships on the Windows image.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache vendored grammars
        uses: actions/cache@v4
        with:
          path: zig/vendor
          key: vendor-${{ hashFiles('zig/fetch-vendor.sh') }}

      - name: Fetch vendored grammars
        env:
          # Anonymous https clones get throttled on Actions runners and git
          # falls back to a credential prompt, which fails the job.
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          cd zig && ./fetch-vendor.sh

      # main.zig, build.zig and tests_main.zig live outside src/, so checking
      # only src/ let them drift out of format unnoticed.
      - name: Format check
        run: cd zig && zig fmt --check src/ main.zig build.zig tests_main.zig

      - name: Build
        run: cd zig && zig build

      # `zig build test` runs the tests through the build runner's IPC protocol
      # on stdout, which the linked tree-sitter C sources corrupt through their
      # debug printf paths. Build the test binary and run it directly instead —
      # same tests, no protocol in the way.
      - name: Unit tests
        run: |
          cd zig
          zig build test-bin
          # test.exe on Windows, test elsewhere.
          if [ -x zig-out/bin/test.exe ]; then ./zig-out/bin/test.exe; else ./zig-out/bin/test; fi

      # The MCP protocol itself, driven over real stdio against the built
      # binary. Runs per platform: the stdin read path is the one place where
      # Windows differs from POSIX at the syscall level.
      - name: End-to-end MCP stdio
        run: cd zig && zig build e2e

  # The installers, the skill and the hint are shell and python, so they run
  # once rather than per platform. They need a built binary to validate against.
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache vendored grammars
        uses: actions/cache@v4
        with:
          path: zig/vendor
          key: vendor-${{ hashFiles('zig/fetch-vendor.sh') }}

      - name: Fetch vendored grammars
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          cd zig && ./fetch-vendor.sh

      - name: Build
        run: cd zig && zig build

      - name: The hint and the measurement must agree on what a code question is
        run: bash plugin/test_hint.sh

      # Both installers derive the release asset name from uname, which did not
      # match the matrix on a Mac. That shipped, so it is checked now.
      - name: Both installers must ask for assets the release publishes
        run: bash plugin/test_platform.sh

      - name: Validate the skill against the server
        run: |
          python3 plugin/validate_skill.py \
            plugin/skills/codeindex/SKILL.md \
            zig/zig-out/bin/codeindex \
            "$PWD"

  # Every target the release publishes must compile before a tag is cut, on one
  # machine, so a broken target is caught here and not by a failed release run.
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache vendored grammars
        uses: actions/cache@v4
        with:
          path: zig/vendor
          key: vendor-${{ hashFiles('zig/fetch-vendor.sh') }}

      - name: Fetch vendored grammars
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          cd zig && ./fetch-vendor.sh

      - name: Cross-compile every published target
        run: |
          cd zig
          for t in x86_64-linux aarch64-linux x86_64-macos aarch64-macos \
                   x86_64-windows aarch64-windows; do
            echo "::group::$t"
            zig build -Dtarget=$t -Doptimize=ReleaseFast
            echo "::endgroup::"
          done
