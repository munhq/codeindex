name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache vendored grammars
        uses: actions/cache@v4
        with:
          path: zig/vendor
          key: vendor-${{ hashFiles('zig/fetch-vendor.sh') }}

      - name: Fetch vendored grammars
        env:
          # Anonymous https clones get throttled on Actions runners and git
          # falls back to a credential prompt, which fails the job.
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          cd zig && ./fetch-vendor.sh

      # main.zig, build.zig and tests_main.zig live outside src/, so checking
      # only src/ let them drift out of format unnoticed.
      - name: Format check
        run: cd zig && zig fmt --check src/ main.zig build.zig tests_main.zig

      - name: Build
        run: cd zig && zig build

      # `zig build test` runs the tests through the build runner's IPC protocol
      # on stdout, which the linked tree-sitter C sources corrupt through their
      # debug printf paths. Build the test binary and run it directly instead —
      # same tests, no protocol in the way.
      - name: Unit tests
        run: |
          cd zig
          zig build test-bin
          ./zig-out/bin/test

      # The skill names tools and arguments that only the server can confirm, so
      # drift between the two is invisible to the compiler and to the tests. This
      # check existed and nothing ran it, which is how the skill came to advertise
      # 13 analyses against a server that implements 16, and how a server that
      # answered about a different repository still passed review. It starts the
      # real binary, checks every documented name and argument against the live
      # schema, and executes each documented route.
      - name: Validate the skill against the server
        run: |
          python3 plugin/validate_skill.py \
            plugin/skills/codeindex/SKILL.md \
            zig/zig-out/bin/codeindex \
            "$PWD"
