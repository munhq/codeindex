[package]
name = "codeindex"
version = "0.1.0"
edition = "2024"
description = "Structural code intelligence engine — AST-free symbol extraction, trigram search, inverted word index, dependency graphs, and file watching"
license = "MIT OR Apache-2.0"
repository = "https://github.com/munhq/codeindex"
keywords = ["code", "search", "index", "symbols", "agent"]
categories = ["development-tools", "text-processing"]
rust-version = "1.85"

[[bin]]
name = "codeindex-mcp"
path = "src/bin/mcp.rs"
required-features = ["mcp"]

[features]
default = ["watcher"]
watcher = ["dep:notify", "dep:moka"]
db = ["dep:sqlx"]
nats = ["dep:async-nats", "dep:futures"]
mcp = ["dep:rmcp", "dep:schemars", "dep:tracing-subscriber", "dep:clap"]

[dependencies]
tokio = { version = "1", features = ["fs", "sync", "time", "macros", "rt", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
regex = "1"
lazy_static = "1"
ahash = "0.8"
tracing = "0.1"
ignore = "0.4"
async-trait = "0.1"

# watcher feature
notify = { version = "6", optional = true }
moka = { version = "0.12", features = ["sync"], optional = true }

# db feature
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls"], optional = true }

# nats feature
async-nats = { version = "0.38", optional = true }
futures = { version = "0.3", optional = true }

# mcp feature
rmcp = { version = "1", features = ["server", "macros", "transport-io"], optional = true }
schemars = { version = "1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
pretty_assertions = "1"
